<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExcretionQuest — Bubble's Clean-Up Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sky:#e6f4ff;--blue:#3a8dde;--deep:#1f4e79;--pink:#ff7aa8;--ok:#2fb36d;--bad:#e5484d;--ink:#1d2b3a;--muted:#5d7189;--line:#cfe6fb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#d6edff 0%,#f3faff 55%,#eaf6ff 100%);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;border-bottom:2px solid var(--line)}
.brand{font-weight:900;color:var(--deep);font-size:1.15rem;cursor:pointer;white-space:nowrap}
.brand span{color:var(--pink)}
.hud{display:flex;gap:8px;align-items:center}
.pill{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;white-space:nowrap}
.iconbtn{font:inherit;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-size:1rem;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 0 var(--line),0 12px 30px rgba(58,141,222,.12);padding:20px;margin-bottom:18px}
h1,h2,h3{margin:.2em 0 .45em;line-height:1.2}
h1{color:var(--deep);font-weight:900}
h2{color:var(--deep);font-weight:900}
p{line-height:1.55}
.muted{color:var(--muted)}
.btn{font:inherit;font-weight:800;border:none;border-radius:14px;padding:12px 18px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 4px 0 #2766a8;transition:transform .08s;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2766a8}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #d24f80}
.btn.green{background:var(--ok);box-shadow:0 4px 0 #1f8a51}
.btn.ghost{background:#fff;color:var(--deep);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{padding:7px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.guide{display:flex;gap:12px;align-items:flex-end;margin:6px 0 14px}
.guide .dog{flex:0 0 auto;animation:bob 2.6s ease-in-out infinite}
.speech{position:relative;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:700;flex:1;line-height:1.45}
.speech:before{content:"";position:absolute;left:-17px;bottom:20px;border:8px solid transparent;border-right-color:var(--line)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
input[type=text]{font:inherit;font-size:1.1rem;padding:12px 14px;border:3px solid var(--line);border-radius:14px;width:min(320px,100%);outline:none}
input[type=text]:focus{border-color:var(--blue)}
/* title */
.hero{text-align:center;padding:26px 20px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);margin:.1em 0}
.hero .sub{font-size:1.15rem;color:var(--muted);font-weight:700}
.organs-strip{font-size:2.4rem;letter-spacing:10px;margin:8px 0}
/* map */
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:640px){.map{grid-template-columns:1fr}}
.zone{cursor:pointer;border-radius:22px;padding:18px 18px 16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .15s;border:none;text-align:left;font:inherit}
.zone:hover{transform:translateY(-3px) rotate(-.4deg)}
.zone .em{font-size:3rem;line-height:1}
.zone h3{font-size:1.4rem;margin:.3em 0 .1em;color:#fff}
.zone .ex{font-weight:700;opacity:.95}
.zone .stars{position:absolute;top:14px;right:16px;font-size:1.3rem;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 10px}
.zone .badge{position:absolute;bottom:12px;right:14px;background:#fff;color:var(--deep);font-weight:900;border-radius:999px;padding:3px 10px;font-size:.85rem}
.z-lungs{background:linear-gradient(135deg,#ff8fab,#ff5c8a)}
.z-skin{background:linear-gradient(135deg,#f6b26b,#e8894a)}
.z-kidneys{background:linear-gradient(135deg,#d9605a,#a63f3a)}
.z-liver{background:linear-gradient(135deg,#8e5ac8,#5b3a96)}
.boss{background:linear-gradient(135deg,#3a8dde,#1f4e79);color:#fff;border-radius:22px;padding:20px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.15);display:flex;align-items:center;gap:16px;border:none;width:100%;text-align:left;font:inherit;margin-top:16px}
.boss .em{font-size:3rem}
.boss h3{color:#fff;font-size:1.4rem;margin:0}
/* organ page */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.tab{font:inherit;font-weight:800;border:3px solid var(--line);background:#fff;color:var(--deep);border-radius:14px;padding:9px 14px;cursor:pointer}
.tab.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:720px){.facts{grid-template-columns:1fr}}
.fact{background:var(--sky);border-radius:16px;padding:12px 14px}
.fact .fh{display:block;color:var(--deep);margin-bottom:4px;font-weight:900}
.fact ol,.fact ul{margin:4px 0 0;padding-left:20px}
.fact li{margin:2px 0}
.learn{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
@media(max-width:760px){.learn{grid-template-columns:1fr}}
.dia-wrap{background:linear-gradient(180deg,#f7fbff,#eef7ff);border:3px solid var(--line);border-radius:18px;padding:8px}
.dia-wrap svg{width:100%;height:auto;display:block}
.part{cursor:pointer;transition:filter .2s}
.part:hover{filter:brightness(1.12)}
.part.active{filter:drop-shadow(0 0 3px #ff2d7a) drop-shadow(0 0 7px #ff2d7a);animation:glow 1.2s ease-in-out infinite}
.part.right{filter:drop-shadow(0 0 4px #2fb36d) drop-shadow(0 0 9px #2fb36d)}
.part.wrong{filter:drop-shadow(0 0 4px #e5484d) drop-shadow(0 0 9px #e5484d)}
@keyframes glow{50%{filter:drop-shadow(0 0 1px #ff2d7a) drop-shadow(0 0 4px #ff2d7a)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font:inherit;font-weight:800;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--deep)}
.chip.seen{background:#e7f8ee;border-color:#9fdcb9}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.info{background:#fffaf0;border:3px dashed #ffd59a;border-radius:16px;padding:14px;min-height:120px}
.info h3{color:#b5651d}
.viewsw{display:flex;gap:8px;margin-bottom:8px}
.progress{height:12px;background:#e3f0fb;border-radius:999px;overflow:hidden;margin:8px 0}
.progress > div{height:100%;background:linear-gradient(90deg,#57c785,#2fb36d);width:0;transition:width .3s}
/* quiz */
.qtext{font-size:1.25rem}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{font:inherit;font-weight:700;text-align:left;border:3px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:1.02rem}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f3f9ff}
.opt.right{background:#e7f8ee;border-color:var(--ok)}
.opt.wrong{background:#fdecec;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:12px 14px;margin:10px 0;font-weight:600;line-height:1.5}
.fb.ok{background:#e7f8ee;border:2px solid #9fdcb9}
.fb.no{background:#fdecec;border:2px solid #f3b1b3}
.tbar{height:12px;background:#e3f0fb;border-radius:999px;overflow:hidden;margin:6px 0 10px}
.tbar > div{height:100%;width:100%;background:linear-gradient(90deg,#ffb547,#ff5c5c)}
.qhead{display:flex;gap:8px;flex-wrap:wrap}
/* lungs game */
.arena{position:relative;height:380px;border-radius:22px;overflow:hidden;border:3px solid #f3b6c6;background:radial-gradient(circle at 50% 120%,#ffd6e0 0%,#ffe9ef 50%,#fff5f8 100%);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.arena .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;color:#c0466b;text-align:center;padding:20px}
.cap{position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(90deg,#e63946 0 40px,#3a6fd8 40px 80px);opacity:.35}
.mol{position:absolute;bottom:-70px;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:1.05rem;cursor:pointer;animation:rise linear forwards;box-shadow:inset -6px -6px 0 rgba(0,0,0,.12),0 3px 6px rgba(0,0,0,.15);touch-action:manipulation}
.mol.co2{background:#7b8794}
.mol.h2o{background:#4aa3df}
.mol.o2{background:#ef5b5b}
.mol.pop{animation:pop .3s forwards!important}
@keyframes rise{to{transform:translateY(-470px)}}
@keyframes pop{to{transform:scale(1.8);opacity:0}}
.floaty{position:absolute;font-weight:900;pointer-events:none;animation:floatup .8s forwards;font-size:1.2rem}
@keyframes floatup{to{transform:translateY(-40px);opacity:0}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 10px;font-weight:700}
.legend i{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;margin-right:4px}
/* kidney sort */
.sortcard{text-align:center;background:var(--sky);border-radius:20px;padding:18px;margin:6px 0 12px;animation:popin .3s}
.sortcard .big{font-size:3.4rem}
@keyframes popin{from{transform:scale(.8);opacity:0}}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.bins{grid-template-columns:1fr}}
.bin{font:inherit;font-weight:800;border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px 10px;cursor:pointer;font-size:1rem}
.bin:hover:not(:disabled){border-color:var(--blue)}
.bin.right{background:#e7f8ee;border-color:var(--ok)}
.bin.wrong{background:#fdecec;border-color:var(--bad)}
.seqbuilt{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:var(--sky);border-radius:16px;padding:10px;margin:10px 0;align-items:center}
.seqbuilt .step{background:var(--ok);color:#fff;font-weight:800;border-radius:12px;padding:8px 12px}
.seqbuilt .arrow{font-weight:900;color:var(--deep)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:0 auto}
@media(max-width:600px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{font:inherit;aspect-ratio:1/1;border-radius:16px;border:none;cursor:pointer;font-weight:800;font-size:.86rem;padding:8px;line-height:1.25;color:#fff;background:linear-gradient(135deg,#8e5ac8,#5b3a96);box-shadow:0 4px 0 #3e2770;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .2s}
.mcard .back{font-size:2rem}
.mcard.up.term{background:#fff;color:var(--deep);border:3px solid #8e5ac8;box-shadow:0 4px 0 #c9b3ea}
.mcard.up.meaning{background:#fff8e6;color:#7a4b00;border:3px solid #f0b33c;box-shadow:0 4px 0 #f3d79a}
.mcard.done{background:#e7f8ee!important;border:3px solid var(--ok)!important;color:#1b6b40!important;box-shadow:0 4px 0 #9fdcb9!important;cursor:default}
/* hotspot */
.prompt{font-size:1.2rem;font-weight:900;background:#fff3d6;border:3px solid #ffd27a;border-radius:16px;padding:12px 14px;margin:6px 0 10px;color:#7a4b00}
/* cert */
.cert{border:10px double #3a8dde;border-radius:20px;padding:28px;text-align:center;background:linear-gradient(180deg,#fff,#f3faff)}
.cert h1{font-size:2rem}
.cert .nm{font-size:2rem;font-weight:900;color:var(--pink);border-bottom:3px dotted var(--line);display:inline-block;padding:0 20px 4px;margin:6px 0}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.result-big{font-size:3rem;text-align:center;margin:6px 0}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 0 24px}
@media print{header,footer,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header>
  <div class="brand" id="brand">🐾 Excretion<span>Quest</span></div>
  <div class="hud">
    <span class="pill" id="xp">⭐ 0 XP</span>
    <button class="iconbtn" id="snd" title="Sound on/off">🔊</button>
  </div>
</header>
<main id="app"></main>
<footer>ExcretionQuest · Junior High Biology · Lungs · Skin · Kidneys · Liver</footer>

<script>
/* ===================== Helpers ===================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
let timers = [];
function clearTimers(){ timers.forEach(t=>{clearInterval(t);clearTimeout(t);}); timers=[]; }

const KEY = 'excretionquest_v1';
function blank(){ return {name:'', sound:true, showdown:0, organs:{lungs:{},skin:{},kidneys:{},liver:{}}}; }
let S = (()=>{ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d && d.organs) return d; }catch(e){} return blank(); })();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} updateHud(); }

function xp(){
  let t = S.showdown||0;
  for(const k in S.organs){ const o=S.organs[k]; t += (o.learn?50:0) + (o.gameBest||0) + (o.quizBest||0)*20; }
  return t;
}
function starsOf(id){ const o=S.organs[id]; return (o.learn?1:0)+(o.gamePass?1:0)+((o.quizBest||0)>=4?1:0); }
function updateHud(){ $('#xp').textContent = '⭐ '+xp()+' XP'; $('#snd').textContent = S.sound?'🔊':'🔇'; }

/* sound */
let AC=null;
function tone(f, d=0.12, type='sine', delay=0, vol=0.15){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+delay;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
const sfx = {
  good(){ tone(660,.1,'triangle'); tone(880,.14,'triangle',.09); },
  bad(){ tone(200,.22,'sawtooth',0,.08); },
  pop(){ tone(520+Math.random()*200,.07,'square',0,.06); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',i*.12)); },
  click(){ tone(440,.05,'sine',0,.06); }
};
function confetti(n=80){
  const cols=['#ff7aa8','#3a8dde','#ffd166','#2fb36d','#8e5ac8','#f6b26b'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=pick(cols);
    c.style.animationDuration=(1.8+Math.random()*1.8)+'s'; c.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
  }
}

/* ===================== Bubble the Maltese ===================== */
function dog(size=96, mood='happy'){
  const mouth = mood==='sad'
    ? '<path d="M52 84 Q60 78 68 84" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
    : '<path d="M52 79 Q60 87 68 79" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M56.5 82.5 Q60 93 63.5 82.5Z" fill="#ff8fab"/>';
  const eyes = mood==='wow'
    ? '<circle cx="47" cy="62" r="7" fill="#222"/><circle cx="73" cy="62" r="7" fill="#222"/><circle cx="49.5" cy="59.5" r="2.6" fill="#fff"/><circle cx="75.5" cy="59.5" r="2.6" fill="#fff"/><circle cx="45" cy="65" r="1.2" fill="#fff"/><circle cx="71" cy="65" r="1.2" fill="#fff"/>'
    : '<circle cx="47" cy="62" r="5.5" fill="#222"/><circle cx="73" cy="62" r="5.5" fill="#222"/><circle cx="49" cy="60" r="1.9" fill="#fff"/><circle cx="75" cy="60" r="1.9" fill="#fff"/>';
  return `<svg class="dogsvg" width="${size}" height="${size}" viewBox="0 0 120 124" role="img" aria-label="Bubble the Maltese">
  <ellipse cx="60" cy="112" rx="32" ry="12" fill="#fff" stroke="#d6e2ee" stroke-width="2"/>
  <path d="M26 48 C6 78 12 116 34 120 C42 104 40 80 42 60Z" fill="#fff" stroke="#d6e2ee" stroke-width="2"/>
  <path d="M94 48 C114 78 108 116 86 120 C78 104 80 80 78 60Z" fill="#fff" stroke="#d6e2ee" stroke-width="2"/>
  <circle cx="60" cy="64" r="32" fill="#fff" stroke="#d6e2ee" stroke-width="2"/>
  <path d="M28 52 C34 28 86 28 92 52 C82 43 72 46 60 39 C48 46 38 43 28 52Z" fill="#fff" stroke="#d6e2ee" stroke-width="1.5"/>
  <path d="M31 46 C14 62 16 96 29 106 C35 92 35 68 38 54Z" fill="#fbfdff" stroke="#d6e2ee" stroke-width="2"/>
  <path d="M89 46 C106 62 104 96 91 106 C85 92 85 68 82 54Z" fill="#fbfdff" stroke="#d6e2ee" stroke-width="2"/>
  <path d="M33 70 C30 84 32 96 36 102 M87 70 C90 84 88 96 84 102" stroke="#e4ecf4" stroke-width="1.5" fill="none"/>
  ${eyes}
  <ellipse cx="60" cy="73" rx="5.5" ry="4" fill="#222"/>
  <circle cx="40" cy="74" r="5" fill="#ffc2d1" opacity=".75"/><circle cx="80" cy="74" r="5" fill="#ffc2d1" opacity=".75"/>
  ${mouth}
  <path d="M60 31 L45 22 L45 40Z M60 31 L75 22 L75 40Z" fill="#ff7aa8" stroke="#e65a8c" stroke-width="1.5"/>
  <circle cx="60" cy="31" r="4.5" fill="#ff4f8b"/>
  </svg>`;
}
function guide(text, mood='happy', size=86, id=''){
  return `<div class="guide"><div class="dog" ${id?`id="${id}-dog"`:''}>${dog(size,mood)}</div><div class="speech" ${id?`id="${id}"`:''}>${text}</div></div>`;
}

/* ===================== Diagrams ===================== */
const HIT = (d,w=24) => `<path d="${d}" stroke="rgba(0,0,0,0)" stroke-width="${w}" fill="none"/>`;

const LUNG_SVG = `<svg viewBox="0 0 400 330">
<defs><linearGradient id="lgL" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffc9d6"/><stop offset="1" stop-color="#ff8fab"/></linearGradient></defs>
<g class="part" data-part="rightlung">
 <path d="M182 108 C120 96 68 150 66 232 C64 282 108 298 172 288 C188 250 190 150 182 108Z" fill="url(#lgL)" stroke="#d85a7f" stroke-width="3"/>
 <path d="M181 170 C150 172 110 178 72 196" stroke="#c0466b" stroke-width="2.5" fill="none"/>
 <path d="M180 140 C160 190 130 240 98 284" stroke="#c0466b" stroke-width="2.5" fill="none"/>
</g>
<g class="part" data-part="leftlung">
 <path d="M218 108 C280 96 332 150 334 232 C336 282 292 298 230 288 C240 270 254 252 240 232 C226 214 214 196 218 108Z" fill="url(#lgL)" stroke="#d85a7f" stroke-width="3"/>
 <path d="M222 142 C258 172 296 220 316 280" stroke="#c0466b" stroke-width="2.5" fill="none"/>
</g>
<g class="part" data-part="bronchioles">
 <path d="M172 140 L150 168 L128 180 M150 168 L146 200 L124 222 M146 200 L160 236 M228 140 L250 168 L272 180 M250 168 L256 204 L278 226 M256 204 L244 240" stroke="#b5365e" stroke-width="3" fill="none" stroke-linecap="round"/>
 ${HIT("M172 140 L150 168 L128 180 M150 168 L146 200 L124 222 M146 200 L160 236 M228 140 L250 168 L272 180 M250 168 L256 204 L278 226 M256 204 L244 240",14)}
</g>
<g class="part" data-part="bronchi">
 <path d="M200 96 L200 112 C190 122 182 130 170 142 M200 112 C210 122 218 130 230 142" stroke="#f4d6dc" stroke-width="14" fill="none" stroke-linecap="round"/>
 <path d="M200 96 L200 112 C190 122 182 130 170 142 M200 112 C210 122 218 130 230 142" stroke="#c98a99" stroke-width="2" fill="none" stroke-dasharray="3 5"/>
 ${HIT("M200 96 L200 112 C190 122 182 130 170 142 M200 112 C210 122 218 130 230 142",24)}
</g>
<g class="part" data-part="trachea">
 <rect x="189" y="10" width="22" height="90" rx="7" fill="#f6dfe4" stroke="#c98a99" stroke-width="2.5"/>
 <path d="M189 22 h22 M189 34 h22 M189 46 h22 M189 58 h22 M189 70 h22 M189 82 h22" stroke="#c98a99" stroke-width="2"/>
</g>
<g class="part" data-part="diaphragm">
 <path d="M36 312 Q200 248 364 312" stroke="#b5651d" stroke-width="11" fill="none" stroke-linecap="round"/>
 ${HIT("M36 312 Q200 248 364 312",26)}
</g>

const SORT = [
  {e:'🔴',n:'Red blood cells',a:0,why:"Too big to pass through the glomerulus filter — they stay in the blood."},
  {e:'🧬',n:'Blood proteins',a:0,why:"Proteins are too large to be filtered. Protein in urine (albuminuria) can be a sign of kidney damage."},

  {e:'💧',n:'Most of the water',a:1,why:"About 99% of the filtered water is reabsorbed! Only the extra water leaves in urine."},

const BINS = ['🩸 Stays in the blood<br><small>(not filtered)</small>','🔁 Filtered, then<br>reabsorbed','🚽 Leaves in<br>urine'];
const SEQS = [
  {title:"Put the 3 stages of urine formation in order:", items:['Filtration (glomerulus)','Reabsorption (proximal tubule)','Augmentation (distal tubule)']},
  {title:"Now trace urine's journey out of the body:", items:['Kidney','Ureter','Urinary bladder','Urethra']}
];
function gameKidney(el,id){
  const items=shuffle(SORT); let i=0, correct=0, seqMistakes=0;
  function showItem(){
    const it=items[i];
    el.innerHTML = `${guide("<b>Nephron Filter Factory!</b> Decide what happens to each substance in the kidney. Get <b>7 out of 10</b> right, then finish the order puzzles!",'happy',80,'kg')}

    $$('.bin',el).forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, ok=k===it.a;

      $('#kfb',el).innerHTML = `<div class="fb ${ok?'ok':'no'}">${ok?'✅':'❌'} ${it.why}</div><div class="row"><button class="btn" id="knext">${i<items.length-1?'Next →':'Order puzzles →'}</button></div>`;
      $('#knext',el).onclick=()=>{ i++; if(i<items.length) showItem(); else seq(0); };
    });
  }
  function seq(s){
    const S2=SEQS[s]; let pos=0;
    el.innerHTML = `${guide(`<b>Order puzzle ${s+1}/2:</b> ${S2.title} Tap them in the right order!`,'happy',80,'kg')}
      <div class="seqbuilt" id="built"><span class="muted">Tap below to build the order…</span></div>
      <div class="row" id="opts">${shuffle(S2.items).map(t=>`<button class="btn ghost" data-t="${esc(t)}">${t}</button>`).join('')}</div>`;
    $$('#opts .btn',el).forEach(b=>b.onclick=()=>{
      if(b.dataset.t===S2.items[pos]){
        sfx.good(); const built=$('#built',el); if(pos===0) built.innerHTML='';
        built.insertAdjacentHTML('beforeend',`${pos?'<span class="arrow">→</span>':''}<span class="step">${S2.items[pos]}</span>`);
        b.remove(); pos++;
        if(pos===S2.items.length){ $('#kg',el).innerHTML='Perfect order! 🐾'; $('#kg-dog',el).innerHTML=dog(80,'wow'); timers.push(setTimeout(()=>{ if(s===0) seq(1); else finish(); },1300)); }
      } else { sfx.bad(); seqMistakes++; b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400); $('#kg',el).innerHTML='Hmm, not that one yet. Think: what happens <b>first</b>?'; $('#kg-dog',el).innerHTML=dog(80,'sad'); }
    });
  }
  function finish(){
    const pass=correct>=7;
    gameResult(el,id,{pass,points:correct*15+Math.max(0,50-seqMistakes*10),title:pass?`Filter master! You sorted <b>${correct}/10</b> correctly.`:`You sorted <b>${correct}/10</b> — you need 7.`,
      detail:`Order-puzzle mistakes: ${seqMistakes}. Remember: big things stay in blood, useful things are reabsorbed, wastes leave in urine!`});
  }
  showItem();
}

/* ---------- Liver game ---------- */
const PAIRS = [
  ['Hemoglobin of old red blood cells','Broken down into bile pigments'],
  ['Ammonia (toxic)','Turned into urea'],
  ['Bile','Breaks fat into tiny droplets'],
  ['Gallbladder','Stores bile'],
  ['Extra glucose','Stored as glycogen'],
  ['Bile pigments','Make feces brown']
];
function gameLiver(el,id){
  const cards = shuffle(PAIRS.flatMap((p,k)=>[{k,t:p[0],kind:'term'},{k,t:p[1],kind:'meaning'}]));
  let open=[], matched=0, moves=0, lock=false;
  el.innerHTML = `${guide("<b>Liver Lab Match!</b> Flip two cards to match each liver substance (purple) with what happens to it (yellow). Match all 6 pairs in <b>16 moves or fewer</b> to win!",'happy',80,'mg')}
    <div class="row" style="margin-bottom:10px"><span class="pill">Moves <b id="mv">0</b></span><span class="pill">Pairs <b id="pr">0</b>/6</span></div>
    <div class="mem">${cards.map((c,i)=>`<button class="mcard" data-i="${i}"><span class="back">🐾</span></button>`).join('')}</div>`;
  $$('.mcard',el).forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, c=cards[i];
    if(lock||b.classList.contains('up')||b.classList.contains('done')) return;
    sfx.click(); b.classList.add('up',c.kind); b.innerHTML=(c.kind==='term'?'🟣 ':'🟡 ')+c.t; open.push(b);
    if(open.length===2){
      moves++; $('#mv',el).textContent=moves;
      const [a,b2]=open, ca=cards[+a.dataset.i], cb=cards[+b2.dataset.i];
      if(ca.k===cb.k && ca.kind!==cb.kind){
        sfx.good(); a.classList.add('done'); b2.classList.add('done'); open=[]; matched++; $('#pr',el).textContent=matched;
        $('#mg',el).innerHTML=`Match! <b>${PAIRS[ca.k][0]}</b> → ${PAIRS[ca.k][1]}. 🐾`; $('#mg-dog',el).innerHTML=dog(80,'wow');
        if(matched===6) timers.push(setTimeout(finish,900));
      } else {
        lock=true; sfx.bad(); $('#mg-dog',el).innerHTML=dog(80,'sad'); $('#mg',el).innerHTML='Not a pair — remember where they are!';
        timers.push(setTimeout(()=>{ [a,b2].forEach(x=>{ x.classList.remove('up','term','meaning'); x.innerHTML='<span class="back">🐾</span>'; }); open=[]; lock=false; },1100));
      }
    }
  });
  function finish(){
    const pass=moves<=16;
    gameResult(el,id,{pass,points:Math.max(40,200-moves*8),title:pass?`Brilliant memory! All pairs in <b>${moves}</b> moves.`:`All pairs found in <b>${moves}</b> moves — aim for 16 or fewer.`,
      detail:`The liver: breaks down old red blood cells → bile pigments, turns ammonia → urea, makes bile and stores glycogen.`});
  }
}
const GAMES = {lungs:gameLungs, skin:gameSkin, kidneys:gameKidney, liver:gameLiver};

/* ---------- Quiz engine ---------- */
function runQuiz(el, qs, opts){
  let i=0, correct=0, points=0, streak=0, best=0;
  const T=15;
  function show(){
    const q=qs[i]; const choices=shuffle(q.o.map((t,k)=>({t,ok:k===q.a})));
    el.innerHTML = `<div class="qhead"><span class="pill">Question ${i+1}/${qs.length}</span>${opts.timed?`<span class="pill">🔥 Streak ${streak}</span><span class="pill">⭐ ${points} pts</span>`:`<span class="pill">✅ ${correct}</span>`}</div>
      ${opts.timed?'<div class="tbar"><div id="tf"></div></div>':''}
      ${guide(opts.timed?pick(['Quick! Think fast! ⚡','You can do it! 🐾','Streaks give bonus points! 🔥']):pick(['Think carefully… 🤔','Take your time! 🐾','I believe in you!']),'happy',72,'qg')}
      <h3 class="qtext">${q.q}</h3>
      <div class="opts">${choices.map((c,k)=>`<button class="opt" data-k="${k}">${'ABCD'[k]}. ${c.t}</button>`).join('')}</div>
      <div id="qfb"></div>`;
    let done=false, t0=Date.now();
    const answer=(k)=>{
      if(done) return; done=true; clearTimers();
      const left=Math.max(0,T-(Date.now()-t0)/1000);
      const ok = k>=0 && choices[k].ok;
      $$('.opt',el).forEach((b,j)=>{ b.disabled=true; if(choices[j].ok) b.classList.add('right'); else if(j===k) b.classList.add('wrong'); });
      let gained=0;
      if(ok){ correct++; streak++; best=Math.max(best,streak); if(opts.timed){ gained=100+Math.round(left*5)+(streak>=3?50:0); points+=gained; } sfx.good(); }
      else { streak=0; sfx.bad(); }
      $('#qg-dog',el).innerHTML=dog(72,ok?'wow':'sad');
      $('#qg',el).innerHTML = ok?pick(['Woof! Correct! 🐾','Paw-some!','You’re a natural scientist! 🔬','Tail-wagging good!'])+(opts.timed?` +${gained}${streak>=3?' (🔥 streak bonus!)':''}`:'')
                                 :(k<0?'⏰ Time’s up! Here’s the answer:':pick(['Oops! Let’s learn from it.','Almost! Read the tip below. 🐾']));
      $('#qfb',el).innerHTML = `<div class="fb ${ok?'ok':'no'}">💡 ${q.why}</div><div class="row"><button class="btn" id="qn">${i<qs.length-1?'Next question →':'See results →'}</button></div>`;
      $('#qn',el).onclick=()=>{ i++; if(i<qs.length) show(); else opts.onDone({correct,total:qs.length,points,best}); };
    };
    $$('.opt',el).forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    if(opts.timed){
      timers.push(setInterval(()=>{ const left=T-(Date.now()-t0)/1000; const f=$('#tf',el); if(f) f.style.width=Math.max(0,left/T*100)+'%'; if(left<=0) answer(-1); },100));
    }
  }
  show();
}

function quizPane(el,id){
  const o=ORGANS[id];
  el.innerHTML = `${guide(`<b>${o.name} Trivia!</b> 5 questions. Score <b>4 or 5</b> to earn the trivia star. Ready?`,'happy',80)}
    <div class="row" style="justify-content:center"><button class="btn pink" id="qs">Start trivia ❓</button></div>`;
  $('#qs',el).onclick=()=>runQuiz(el, shuffle(QUIZ[id]), {onDone:r=>{
    const st=S.organs[id], first=r.correct>=4 && (st.quizBest||0)<4;
    st.quizBest=Math.max(st.quizBest||0,r.correct); save();
    const pass=r.correct>=4; if(pass){ sfx.win(); confetti(first?90:40); } else sfx.bad();
    const nextOrgan = Object.keys(ORGANS).find(k=>starsOf(k)<3 && k!==id);
    el.innerHTML = `${guide(pass?`You got <b>${r.correct}/5</b>! ${first?'⭐ Trivia star earned!':''} ${starsOf(id)===3?`🏅 You've MASTERED the ${o.name}!`:''}`:`You got <b>${r.correct}/5</b>. You need 4 for the star — try again!`, pass?'wow':'sad',90)}
      <div class="result-big">${'⭐'.repeat(r.correct)}${'▫️'.repeat(5-r.correct)}</div>
      <div class="row" style="justify-content:center">
        <button class="btn ghost" id="qa">🔁 Try again</button>
        ${starsOf(id)<3?`<button class="btn ghost" id="ql">📖 Review Learn</button>`:''}
        ${nextOrgan?`<button class="btn green" id="qnext">Next: ${ORGANS[nextOrgan].emoji} ${ORGANS[nextOrgan].name} →</button>`:`<button class="btn pink" id="qboss">🏆 Excretion Showdown →</button>`}
        <button class="btn ghost" id="qm">🗺️ Map</button>
      </div>`;
    $('#qa',el).onclick=()=>go(screenOrgan,id,'quiz');
    if($('#ql',el)) $('#ql',el).onclick=()=>go(screenOrgan,id,'learn');
    if($('#qnext',el)) $('#qnext',el).onclick=()=>go(screenOrgan,nextOrgan,'learn');
    if($('#qboss',el)) $('#qboss',el).onclick=()=>go(screenShowdown);
    $('#qm',el).onclick=()=>go(screenMap);
  }});
}

/* ---------- Showdown ---------- */
function screenShowdown(){
  app.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><button class="btn ghost small" id="back">← Map</button><span class="pill">🏆 Best: ${S.showdown||0} pts</span></div>
    <h2 style="margin-top:12px">🏆 Excretion Showdown</h2><div id="sd"></div></div>`;
  $('#back').onclick=()=>go(screenMap);
  const el=$('#sd');
  el.innerHTML = `${guide("This is the BIG one! <b>12 questions</b> from all four organs, <b>15 seconds</b> each. Faster answers = more points, and 3 correct in a row gives a 🔥 streak bonus. Finish to get your certificate!",'wow',90)}
    <div class="row" style="justify-content:center"><button class="btn pink" id="go">I'm ready! 🚀</button></div>`;
  $('#go').onclick=()=>{
    const pool = shuffle([...Object.values(QUIZ).flat(), ...EXTRA]).slice(0,12);
    runQuiz(el,pool,{timed:true,onDone:r=>{ S.showdown=Math.max(S.showdown||0,r.points); save(); go(screenCert,r); }});
  };
}
function rank(p){ return p>=2000?['Excretion Expert','🏆']:p>=1400?['Clean-Up Champion','🥇']:p>=800?['Rising Scientist','🥈']:['Curious Cadet','🌱']; }
function screenCert(r){
  const [title,medal]=rank(r.points);
  const stars=Object.keys(ORGANS).reduce((a,k)=>a+starsOf(k),0);
  const date=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  sfx.win(); confetti(120);
  app.innerHTML = `<div class="card">
    <div class="cert">
      <div style="display:inline-block">${dog(110,'wow')}</div>
      <h1>Certificate of Achievement</h1>
      <div class="muted" style="font-weight:700">This certifies that</div>
      <div class="nm">${esc(S.name)}</div>
      <p style="font-size:1.1rem">completed the <b>ExcretionQuest Showdown</b> and earned the title</p>
      <h2 style="font-size:1.8rem">${medal} ${title} ${medal}</h2>
      <div class="row" style="justify-content:center;margin:10px 0">
        <span class="pill">⭐ ${r.points} points</span><span class="pill">✅ ${r.correct}/${r.total} correct</span><span class="pill">🔥 Best streak ${r.best}</span><span class="pill">🌟 Organ stars ${stars}/12</span>
      </div>
      <div style="font-size:2rem;letter-spacing:8px">🫁 🖐️ 🫘 🟤</div>
      <div class="muted" style="margin-top:8px">${date} · Signed: Bubble the Maltese 🐾</div>
    </div>
    <div class="row noprint" style="justify-content:center;margin-top:16px">
      <button class="btn" id="pr">🖨️ Print / Save as PDF</button>
      <button class="btn ghost" id="again">🔁 Play Showdown again</button>
      <button class="btn ghost" id="map">🗺️ Map</button>
    </div>
    <p class="center muted noprint">📸 Take a screenshot to share your certificate!</p>
  </div>`;
  $('#pr').onclick=()=>window.print();
  $('#again').onclick=()=>go(screenShowdown);
  $('#map').onclick=()=>go(screenMap);
}

/* ===================== Boot ===================== */
$('#brand').onclick=()=>go(S.name?screenMap:screenTitle);
$('#snd').onclick=()=>{ S.sound=!S.sound; save(); if(S.sound) sfx.click(); };
go(screenTitle);
</script>
